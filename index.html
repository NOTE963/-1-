<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ランダム中1方程式</title>
<style>
:root{--d:calc(min(100vw,480px)/411);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:light}
*{box-sizing:border-box;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:#fafafa;color:#777;font-family:Roboto,"Noto Sans JP","Noto Sans CJK JP",system-ui,sans-serif;letter-spacing:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#3700b3;z-index:10}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:#fafafa}
.bar{height:calc(56*var(--d));background:#6200ee;color:#fff;font-size:calc(20*var(--d));font-weight:500;display:flex;align-items:center;padding-left:calc(16*var(--d));box-shadow:0 2px 4px rgba(0,0,0,.25)}
button{font:inherit;font-size:calc(14*var(--d));color:#000;background:#d6d7d7;border:0;border-radius:calc(4*var(--d));height:calc(36*var(--d));min-width:calc(64*var(--d));padding:0 calc(8*var(--d));cursor:pointer;box-shadow:0 2px 3px rgba(0,0,0,.25);letter-spacing:0}
button:active{background:#c4c5c5}
button:disabled{opacity:.5}
.hidden{display:none!important}
#home{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 56*var(--d) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
#home h1{margin:0 0 calc(44*var(--d));font-size:calc(24*var(--d));font-weight:400;color:#777;line-height:calc(32*var(--d))}
#home button{margin-top:calc(31*var(--d))}
#home h1+button{margin-top:0}
#q{padding:calc(16*var(--d)) calc(16*var(--d)) 0;font-size:calc(20*var(--d));line-height:calc(28*var(--d));color:#777}
.ed{display:block;height:calc(28*var(--d));padding:0;border:0;border-bottom:calc(1*var(--d)) solid #666;background:transparent;font:inherit;font-size:calc(18*var(--d));color:#222;outline:none;border-radius:0}
.ed::placeholder{color:#777;opacity:1}
.ed:focus{border-bottom:calc(2*var(--d)) solid #6200ee}
#inp{width:calc(100% - 40*var(--d));margin:calc(8*var(--d)) calc(20*var(--d)) 0}
.row{display:flex;gap:calc(8*var(--d));margin:calc(19*var(--d)) 0 0 calc(20*var(--d))}
.row button{width:calc(80*var(--d))}
.row2{display:flex;gap:calc(8*var(--d));margin:calc(16*var(--d)) 0 0 calc(20*var(--d))}
#cnt,#turn{margin:calc(36*var(--d)) 0 0;padding:0 calc(16*var(--d));font-size:calc(13*var(--d));line-height:calc(18*var(--d));color:#777}
#turn{margin-top:calc(4*var(--d));color:#6200ee}
#memo{display:block;width:calc(100% - 32*var(--d));height:calc(200*var(--d));margin:calc(21*var(--d)) calc(16*var(--d)) 0;background:#fff;touch-action:none}
.pad{padding:calc(16*var(--d)) calc(20*var(--d))}
.pad .ed{width:100%;margin-top:calc(16*var(--d))}
.pad .row2{margin-left:0}
.pad p{font-size:calc(16*var(--d));line-height:calc(24*var(--d));margin:calc(12*var(--d)) 0 0}
.pad ul{margin:calc(8*var(--d)) 0 0;padding-left:calc(20*var(--d));font-size:calc(16*var(--d));line-height:calc(26*var(--d));color:#333}
.note{font-size:calc(13*var(--d))!important;color:#777}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:20}
#dlg .card{background:#fff;color:#222;border-radius:calc(4*var(--d));width:calc(300*var(--d));padding:calc(24*var(--d)) calc(24*var(--d)) calc(8*var(--d))}
#dlg h2{margin:0 0 calc(16*var(--d));font-size:calc(20*var(--d));font-weight:500}
#dlg p{margin:0;font-size:calc(16*var(--d));line-height:calc(24*var(--d));color:#555}
#dlg .acts{display:flex;justify-content:flex-end;gap:calc(8*var(--d));margin-top:calc(16*var(--d))}
#dlg .acts button{background:transparent;box-shadow:none;color:#6200ee;font-weight:500}
#toast{position:fixed;left:50%;bottom:calc(48*var(--d));transform:translateX(-50%);background:#323232;color:#fff;font-size:calc(14*var(--d));padding:calc(10*var(--d)) calc(16*var(--d));border-radius:calc(4*var(--d));z-index:30;pointer-events:none;max-width:90vw;text-align:center}
</style>
</head>
<body>
<div class="app">
<div class="bar">ランダム中1方程式</div>

<div id="home">
<h1>ランダム中1方程式</h1>
<button id="mInf">無限モード</button>
<button id="mCh">チャレンジモード</button>
<button id="mCo">協力モード</button>
</div>

<div id="game" class="hidden">
<div id="q"></div>
<input id="inp" class="ed" type="text" inputmode="numeric" placeholder="答えを入力" autocomplete="off">
<div class="row"><button id="minus">-</button><button id="submit">解答</button></div>
<p id="cnt"></p>
<p id="turn" class="hidden"></p>
<canvas id="memo"></canvas>
<div class="row2"><button id="clear">メモ欄リセット</button><button id="quit">タイトルへ</button></div>
</div>

<div id="lobby" class="pad hidden">
<div id="lbMenu">
<input id="nm" class="ed" maxlength="12" placeholder="名前（12文字まで）" autocomplete="off">
<input id="cd" class="ed" inputmode="numeric" maxlength="4" placeholder="ルーム番号（4桁）" autocomplete="off">
<div class="row2" style="margin-top:calc(20*var(--d))"><button id="mk">ルーム作成</button><button id="jn">参加</button><button id="lbBack">タイトルへ</button></div>
</div>
<div id="lbRoom" class="hidden">
<p id="rc"></p>
<ul id="pl"></ul>
<p class="note">最大6人。誰かが間違えるとルームは削除されます。</p>
<p id="wait" class="note"></p>
<div class="row2"><button id="go">開始</button><button id="lbQuit">退出</button></div>
</div>
</div>
</div>

<div id="dlg" class="hidden"><div class="card"><h2 id="dt"></h2><p id="msg"></p><div class="acts" id="acts"></div></div></div>
<div id="toast" class="hidden"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
(function(){
var cfg={apiKey:"AIzaSyDWxhILNkj0RrOV248Bh2zoFZfNq2G-3N0",authDomain:"zoukin-kart.firebaseapp.com",databaseURL:"https://zoukin-kart-default-rtdb.firebaseio.com",projectId:"zoukin-kart",storageBucket:"zoukin-kart.firebasestorage.app",messagingSenderId:"627298939041",appId:"1:627298939041:web:3dafaed8c6d267f1d780e0",measurementId:"G-DDW4R9EXW5"};
var $=function(i){return document.getElementById(i)};
function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}return null}
var me=ls("eqUid");if(!me){me=Math.random().toString(36).slice(2,10);ls("eqUid",me)}
var mode=null,score=0,cur=null,best=parseInt(ls("eqBest")||"0",10)||0;
var db=null,ref=null,code=null,isHost=false,room=null,lastKey=null,overShown=false,myName="";

function show(id){["home","game","lobby"].forEach(function(s){$(s).classList.toggle("hidden",s!==id)})}
var tt;function toast(t){var e=$("toast");e.textContent=t;e.classList.remove("hidden");clearTimeout(tt);tt=setTimeout(function(){e.classList.add("hidden")},2200)}
function dlg(title,lines,btns){
  $("dt").textContent=title;var m=$("msg");m.innerHTML="";
  lines.forEach(function(t,i){if(i)m.appendChild(document.createElement("br"));m.appendChild(document.createTextNode(t))});
  var a=$("acts");a.innerHTML="";
  btns.forEach(function(b){var e=document.createElement("button");e.textContent=b[0];e.onclick=b[1];a.appendChild(e)});
  $("dlg").classList.remove("hidden");
}
function closeDlg(){$("dlg").classList.add("hidden")}

function gen(s){
  var l=Math.min(s,30),a=ri(1,3+Math.floor(l/3));
  if(l>=3&&Math.random()<0.4)a=-a;
  var mx=10+Math.floor(l/2),x=ri(-mx,mx),b=0;
  while(b===0)b=ri(-(10+l),10+l);
  return {a:a,b:b,x:x,c:a*x+b};
}
function fmt(q){return q.a+"x "+(q.b<0?"- "+(-q.b):"+ "+q.b)+" = "+q.c+".0"}
function setQ(){$("q").textContent=fmt(cur)+" を解け"}
function setCnt(){$("cnt").textContent="解いた問題数: "+score}

/* ---- solo ---- */
function startSolo(m){
  mode=m;score=0;closeDlg();show("game");$("turn").classList.add("hidden");
  $("inp").disabled=false;$("submit").disabled=false;resize();clearMemo();next();
}
function next(){cur=gen(score);setQ();$("inp").value="";setCnt()}
function submit(){
  var v=$("inp").value.trim().replace(/[−ー－]/g,"-");
  if(!/^-?\d+$/.test(v))return;
  var ok=parseInt(v,10)===cur.x;
  if(mode==="co")return coAnswer(ok,v);
  if(ok){score++;next();return}
  if(mode==="inf"){toast("不正解… もう一度！");$("inp").select();return}
  if(score>best){best=score;ls("eqBest",String(best))}
  dlg("不正解！",[fmt(cur),"答え: x = "+cur.x,"正解数: "+score+" 問","ベスト: "+best+" 問"],[["タイトルへ",home],["もう一度",function(){startSolo("ch")}]]);
}
function home(){closeDlg();mode=null;show("home")}

/* ---- coop ---- */
function initFb(){
  if(!window.firebase){toast("Firebaseを読み込めませんでした");return false}
  if(!db){firebase.initializeApp(cfg);db=firebase.database()}
  return true;
}
function getName(){
  var n=$("nm").value.trim().slice(0,12);
  if(!n){toast("名前を入力してください");return null}
  ls("eqName",n);myName=n;return n;
}
function openCoop(){if(!initFb())return;mode="co";show("lobby");$("lbMenu").classList.remove("hidden");$("lbRoom").classList.add("hidden");$("nm").value=ls("eqName")||""}
async function createRoom(){
  var n=getName();if(!n)return;
  for(var i=0;i<10;i++){
    var c=String(ri(1000,9999)),r=db.ref("rooms/"+c),pl={};pl[me]={name:n};
    try{
      var res=await r.transaction(function(cu){return cu===null?{host:me,status:"waiting",createdAt:Date.now(),players:pl}:undefined});
      if(res.committed){enter(c,true);return}
    }catch(e){toast("作成に失敗しました（ルールを確認）");return}
  }
  toast("ルームを作成できませんでした");
}
async function joinRoom(){
  var n=getName();if(!n)return;
  var c=$("cd").value.trim();
  if(!/^\d{4}$/.test(c)){toast("4桁のルーム番号を入力してください");return}
  var r=db.ref("rooms/"+c);
  try{
    var s=await r.once("value"),v=s.val();
    if(!v){toast("ルームが見つかりません");return}
    if(v.status!=="waiting"){toast("このルームはもう始まっています");return}
    var res=await r.child("players").transaction(function(p){
      p=p||{};if(Object.keys(p).length>=6&&!p[me])return;
      p[me]={name:n};return p;
    });
    if(!res.committed){toast("ルームが満員です");return}
    enter(c,false);
  }catch(e){toast("参加に失敗しました")}
}
function enter(c,host){
  code=c;isHost=host;overShown=false;lastKey=null;mode="co";
  ref=db.ref("rooms/"+c);
  ref.child("players/"+me).onDisconnect().remove();
  if(host)ref.onDisconnect().remove();
  ref.on("value",onRoom);
}
function leaveLocal(){
  if(ref){ref.off();ref.child("players/"+me).onDisconnect().cancel();if(isHost)ref.onDisconnect().cancel()}
  ref=null;code=null;room=null;overShown=false;closeDlg();mode=null;show("home");
}
function quit(){
  if(mode==="co"&&ref){if(isHost)ref.remove();else ref.child("players/"+me).remove();leaveLocal()}
  else home();
}
function onRoom(snap){
  room=snap.val();
  if(!room){if(ref&&!overShown){leaveLocal();toast("ルームが削除されました")}return}
  var ps=room.players||{};
  if(room.status==="waiting"){
    show("lobby");$("lbMenu").classList.add("hidden");$("lbRoom").classList.remove("hidden");
    $("rc").textContent="ルーム番号: "+code;
    var ul=$("pl");ul.innerHTML="";
    Object.keys(ps).forEach(function(k){var li=document.createElement("li");li.textContent=ps[k].name+(k===room.host?"（ホスト）":"")+(k===me?" ←あなた":"");ul.appendChild(li)});
    $("go").classList.toggle("hidden",!isHost);
    $("wait").textContent=isHost?(Object.keys(ps).length+"人参加中。準備ができたら開始してください。"):"ホストの開始を待っています…";
  }else if(room.status==="playing"){
    renderPlay(ps);
  }else if(room.status==="over"&&!overShown){
    overShown=true;var r=room.result||{};
    if(isHost||r.byId===me)setTimeout(function(){if(ref)ref.remove()},20000);
    dlg("不正解！",[(r.by||"誰か")+" さんが間違えました",r.eq||"",(r.by||"?")+" さんの答え: "+r.given,"正しい答え: x = "+r.ans,"チームの正解数: "+(r.score||0)+" 問"],[["タイトルへ",function(){var rr=ref;leaveLocal();rr&&rr.remove()}]]);
  }
}
function renderPlay(ps){
  var order=room.order||[],t=(room.turn||0)%order.length,uid=order[t],myTurn=uid===me;
  if(isHost&&!ps[uid]){
    for(var i=1;i<=order.length;i++){var j=(t+i)%order.length;if(ps[order[j]]){ref.update({turn:j});return}}
    ref.remove();return;
  }
  show("game");$("turn").classList.remove("hidden");
  cur=room.q;score=room.score||0;setQ();setCnt();
  var key=String(score);
  if(key!==lastKey){lastKey=key;$("inp").value="";resize();if(myTurn)$("inp").focus()}
  if(!myTurn)$("inp").value=room.typing||"";
  $("turn").textContent=myTurn?"あなたの番です":(ps[uid]?ps[uid].name:"?")+" さんの番";
  $("inp").disabled=!myTurn;$("submit").disabled=!myTurn;$("minus").disabled=!myTurn;
}
function coAnswer(ok,v){
  if(!ref||!room)return;
  var order=room.order||[],n=order.length;
  if(ok){ref.update({score:score+1,turn:((room.turn||0)+1)%n,q:gen(score+1),typing:""})}
  else ref.update({status:"over",result:{by:myName||ls("eqName")||"?",byId:me,given:v,eq:fmt(cur),ans:cur.x,score:score}});
}
function startCoop(){
  var ids=Object.keys(room.players||{});
  for(var i=ids.length-1;i>0;i--){var j=ri(0,i),t=ids[i];ids[i]=ids[j];ids[j]=t}
  ref.update({status:"playing",order:ids,turn:0,score:0,q:gen(0),typing:""});
}

/* ---- ui ---- */
$("mInf").onclick=function(){startSolo("inf")};
$("mCh").onclick=function(){startSolo("ch")};
$("mCo").onclick=openCoop;
$("submit").onclick=submit;
function pushTyping(){
  if(mode!=="co"||!ref||!room||room.status!=="playing")return;
  var o=room.order||[];
  if(o[(room.turn||0)%o.length]===me)ref.child("typing").set($("inp").value.slice(0,12));
}
$("minus").onclick=function(){var i=$("inp");i.value=i.value.charAt(0)==="-"?i.value.slice(1):"-"+i.value;i.focus();pushTyping()};
$("inp").addEventListener("input",pushTyping);
$("inp").addEventListener("keydown",function(e){if(e.key==="Enter")submit()});
$("quit").onclick=quit;$("lbQuit").onclick=quit;
$("lbBack").onclick=function(){mode=null;show("home")};
$("mk").onclick=createRoom;$("jn").onclick=joinRoom;$("go").onclick=startCoop;

var cv=$("memo"),ctx=cv.getContext("2d"),drawing=false;
function resize(){var r=cv.getBoundingClientRect();if(!r.width)return;var d=window.devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);ctx.lineWidth=3;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#000"}
function pos(e){var r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
cv.addEventListener("pointerdown",function(e){drawing=true;cv.setPointerCapture(e.pointerId);var p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+0.1,p.y);ctx.stroke()});
cv.addEventListener("pointermove",function(e){if(!drawing)return;var p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke()});
["pointerup","pointercancel"].forEach(function(n){cv.addEventListener(n,function(){drawing=false})});
function clearMemo(){ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.restore()}
$("clear").onclick=clearMemo;
})();
</script>
</body>
</html>
