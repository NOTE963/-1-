<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>方程式ゲーム</title>
<style>
body { font-family: sans-serif; padding: 20px; }
#question { font-size: 24px; margin-bottom: 10px; }
#time, #score { margin-top: 10px; }
button { margin: 5px; padding: 10px; }
</style>
</head>
<body>

<h1>方程式ゲーム</h1>

<div id="home">
  <h2>モード選択</h2>
  <button onclick="startGame('random')">無限モード</button>
  <button onclick="startGame('challenge')">チャレンジモード</button>
  <button onclick="startGame('measure')">測定モード</button>
</div>

<div id="game" style="display:none;">
  <div id="question"></div>
  <input type="text" id="answer" placeholder="答えを入力">
  <button onclick="checkAnswer()">解答</button>
  <div id="time"></div>
  <div id="score"></div>
  <button onclick="backHome()">ホームに戻る</button>
</div>

<script>
let mode, a, b, xAnswer, c;
let score = 0;
let questionCount = 0;
const maxQuestions = 10;
let startTime, totalTime = 0;

function startGame(selectedMode) {
  mode = selectedMode;
  score = 0;
  questionCount = 0;
  totalTime = 0;
  document.getElementById('home').style.display = 'none';
  document.getElementById('game').style.display = 'block';
  generateQuestion();
  updateScore();
}

function generateQuestion() {
  const r = () => Math.random();
  a = Math.floor(r()*5)+1;  //1-5
  b = Math.floor(r()*21)-10; //-10~10

  const type = Math.floor(r()*3);
  if(type===0) xAnswer = Math.floor(r()*21)-10;
  else if(type===1) xAnswer = Math.round((Math.floor(r()*201)-100)/1*10)/10;
  else {
    let denom = Math.floor(r()*9)+2;
    let numer = Math.floor(r()*denom*10+1)-denom*5;
    xAnswer = numer/denom;
  }

  c = a*xAnswer + b;

  let cStr = (type===2)? toFraction(c) : (Math.round(c*10)/10);

  let q = a + "x " + (b>=0? "+ ":"- ") + Math.abs(b) + " = " + cStr;
  document.getElementById('question').innerText = q + " を解け";
  document.getElementById('answer').value = "";
  document.getElementById('time').innerText = "";
  startTime = Date.now();
}

function checkAnswer() {
  let input = document.getElementById('answer').value.trim();
  let userAns;
  if(input.includes('/')) {
    let parts = input.split('/');
    if(parts.length!==2){ alert("分数は a/b の形式で"); return; }
    userAns = parseFloat(parts[0])/parseFloat(parts[1]);
  } else {
    userAns = parseFloat(input);
  }

  let elapsed = (Date.now()-startTime)/1000;

  if(Math.abs(userAns - xAnswer)<0.1){
    // 正解
    score++;
    updateScore();
    if(mode==='measure'){
      questionCount++;
      totalTime += elapsed;
      if(questionCount>=maxQuestions){
        alert("測定終了！ 10問の合計時間: "+totalTime+" 秒");
        backHome();
        return;
      }
    }
    document.getElementById('time').innerText = "正解！ "+elapsed+" 秒";
    generateQuestion();
  } else {
    // 不正解
    if(mode==='challenge'){
      alert("不正解！ 正しい答え: "+toFraction(xAnswer));
      backHome();
      return;
    }
    if(mode==='random'){
      document.getElementById('time').innerText = "不正解！ もう一度解こう";
      return;
    }
    if(mode==='measure'){
      document.getElementById('time').innerText = "不正解！ もう一度解こう";
      return;
    }
  }
}

function updateScore(){
  document.getElementById('score').innerText = "解いた問題数: "+score;
}

function backHome(){
  document.getElementById('home').style.display = 'block';
  document.getElementById('game').style.display = 'none';
}

function toFraction(x){
  let denom=1;
  while(Math.abs(x*denom - Math.round(x*denom))>0.001 && denom<=10){ denom++; }
  let numer = Math.round(x*denom);
  if(denom===1) return numer.toString();
  return numer+"/"+denom;
}
</script>
</body>
</html>
